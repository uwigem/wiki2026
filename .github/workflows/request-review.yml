name: Request review

# Asks for a review on every pull request.
#
# Written while the repo was private, when .github/CODEOWNERS could not do this
# on the free plan. The repo is public now, so CODEOWNERS requests the review
# too and this is a backstop. It has been seen working on real pull requests;
# delete it once a CODEOWNERS request has been seen on a teammate's PR.
#
# To change who reviews, change REVIEWER below and the owner in CODEOWNERS.

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

permissions:
  pull-requests: write

env:
  REVIEWER: rishabhlgoenka

jobs:
  request:
    runs-on: ubuntu-latest
    # A pull request from a fork gets a read-only token and cannot request a
    # reviewer, so only run for branches pushed to this repo.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Ask for a review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          # GitHub rejects a review request aimed at the person who opened the
          # pull request, so skip rather than fail the job.
          if [ "$AUTHOR" = "$REVIEWER" ]; then
            echo "$REVIEWER opened this pull request, so there is nobody to ask."
            exit 0
          fi
          gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-reviewer "$REVIEWER"
          echo "Requested a review from $REVIEWER."

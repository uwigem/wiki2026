<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Do not add user-scalable=no here. Pinch-zoom is an accessibility
         requirement on an informational site. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Set from the palette at startup by src/site/palette-vars.ts. The value
         here is a fallback for the first paint. -->
    <meta name="theme-color" content="#93bd8e" />
    <title>HedgehogSense · Washington iGEM 2026</title>
    <meta
      name="description"
      content="Washington iGEM 2026. Designed minibinders that tune how the MEGF8, MOSMO and MGRN1 complex degrades Smoothened, for a tunable approach to Hedgehog signaling."
    />
    <!-- The icon is installed at runtime by src/site/favicon.ts: the team logo
         from src/site/content/teamLogo.ts, drawn on a cream tile. -->
    <!-- The two fonts are served from this site (public/fonts/, declared in
         src/index.css). Preloading the Latin files starts them downloading
         with the page itself, so text is set in the right font from the first
         paint instead of flashing a fallback first. -->
    <link rel="preload" as="font" type="font/woff2" href="%BASE_URL%fonts/pixelify-sans-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="%BASE_URL%fonts/nunito-latin.woff2" crossorigin />
    <!-- The backgrounds (the lawn behind every page, and each page's own
         garden) are preloaded by the page-per-route plugin in vite.config.ts.
         The CDN they come from is named once, in src/site/cdn.ts. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
